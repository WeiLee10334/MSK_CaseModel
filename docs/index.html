<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>個案化肌骨模型</title>
<style>
:root{--bg:#f3f5f8;--panel:#ffffff;--line:#dfe4ea;--ink:#16202b;--dim:#617080;--acc:#b23a32;--acc2:#1f6feb;--chip:#eef2f6;--ok:#1b8a5a;--warn:#b26a00;--stage:#e9edf2}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--panel:#181c22;--line:#2a313a;--ink:#e8edf2;--dim:#93a0ad;--acc:#e0645a;--acc2:#6aa6ff;--chip:#222831;--ok:#4cc38a;--warn:#e0a84a;--stage:#14171c}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
#app{display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
header h1{font-size:15px;margin:0;font-weight:650;white-space:nowrap}header h1 small{font-weight:400;color:var(--dim);font-size:11px;margin-left:6px}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:var(--dim);padding:6px 11px;border-radius:7px;font:inherit;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.18);font-weight:600}
main{flex:1;display:flex;flex-direction:column;min-height:0}
#stage{position:relative;flex:1;min-height:0;background:var(--stage);touch-action:none;overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none}
#views{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
#views button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;opacity:.92}
#status{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--dim);background:color-mix(in srgb,var(--panel) 82%,transparent);padding:3px 8px;border-radius:7px;max-width:calc(100% - 20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#busy{position:absolute;left:10px;top:10px;font-size:12px;background:var(--panel);border:1px solid var(--line);padding:3px 9px;border-radius:7px}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:34px;background:#ffd23f;color:#1a1a1a;padding:5px 11px;border-radius:8px;font-size:13px;font-weight:600;max-width:92%;text-align:center}
#info{position:absolute;left:10px;top:10px;width:min(300px,calc(100% - 68px));background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 6px 22px rgba(0,0,0,.18)}
#info h2{margin:0;font-size:16px;line-height:1.3}#info .en{color:var(--dim);font-size:12px}#info .sum{font-size:12px;margin:3px 0 6px;font-weight:600}#info details{margin-bottom:8px}#info summary{font-size:12px;color:var(--dim);cursor:pointer}
#i-kv{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:12px;margin-top:6px}#i-kv div{display:flex;flex-direction:column}#i-kv span{color:var(--dim);font-size:11px}#i-kv b{font-weight:600}
#info .acts{display:flex;gap:6px;flex-wrap:wrap}#info .acts .btn{height:30px;padding:0 10px;font-size:13px}
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--stage);z-index:5}
#loading .track{width:min(260px,70%);height:6px;border-radius:3px;background:var(--line);overflow:hidden}#lbar{height:100%;width:35%;background:var(--acc);animation:ld 1.2s ease-in-out infinite alternate}@keyframes ld{from{margin-left:0}to{margin-left:65%}}#lmsg{color:var(--dim);font-size:13px}
#panel{flex:none;height:46dvh;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#panel.min{height:auto}#panel.min .tab{display:none}
#tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
#tabs button{flex:1;border:0;background:transparent;color:var(--dim);padding:10px 4px;font:inherit;cursor:pointer;border-bottom:2px solid transparent}
#tabs button.on{color:var(--ink);font-weight:650;border-bottom-color:var(--acc)}#tabs #collapse{flex:none;width:42px}
.tab{flex:1;overflow:auto;padding:10px 12px 18px;-webkit-overflow-scrolling:touch}
h3{font-size:13px;margin:14px 0 6px;color:var(--dim);font-weight:650;letter-spacing:.02em}
.row{display:flex;align-items:center;gap:8px;margin:7px 0}.row>label{flex:none;width:64px;color:var(--dim)}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--acc)}
.row input[type=text],.row input[type=search],.row select{flex:1;min-width:0;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:0 9px;font:inherit}
.numw{flex:none;display:flex;align-items:center;gap:4px}.numw input{width:70px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:0 6px;font:inherit;font-variant-numeric:tabular-nums;text-align:right}.numw i{font-style:normal;color:var(--dim);width:20px;font-size:12px}
.btn{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);font-weight:500}.btn.on{background:#ffd23f;border-color:#ffd23f;color:#1a1a1a}
.chk{display:flex;align-items:center;gap:8px;margin:8px 0;cursor:pointer}.chk input{width:18px;height:18px;flex:none;accent-color:var(--acc)}.sw{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.25);flex:none}
.val{font-variant-numeric:tabular-nums;font-weight:600;margin:2px 0 6px 72px}.gv{width:46px;text-align:right;font-variant-numeric:tabular-nums}.gl{width:54px;text-align:right;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.note{color:var(--dim);font-size:12px;margin:6px 0}.note.warn{color:var(--warn)}
.fitrow{display:grid;grid-template-columns:52px 1fr 1fr auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.dim{color:var(--dim);font-size:12px}.tag{font-size:11px;background:var(--chip);border-radius:6px;padding:1px 7px;color:var(--ok);white-space:nowrap}.fitrow.off .tag{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}th{text-align:left;color:var(--dim);font-weight:600;font-size:12px;padding:4px 6px;border-bottom:1px solid var(--line)}td{padding:5px 6px;border-bottom:1px solid var(--line)}td.n{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.gr{display:inline-block;width:20px;text-align:center;border-radius:5px;font-size:11px;font-weight:700;color:#fff}.grA{background:#1b8a5a}.grB{background:#1f6feb}.grC{background:#b26a00}
.li{display:grid;grid-template-columns:1fr auto;gap:0 8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 2px;font:inherit;cursor:pointer}.li b{grid-column:1}.li .dim{grid-column:1}.li .tag{grid-column:2;grid-row:1/3;align-self:center;color:var(--dim)}
.tools .btn{flex:1}
#ct-prog .track{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:6px 0}#ct-bar{height:100%;width:0;background:var(--acc);transition:width .4s}#ct-log{font-size:11px;color:var(--dim);white-space:pre-wrap;max-height:9em;overflow:auto;margin:4px 0;background:var(--chip);padding:6px 8px;border-radius:6px}
#preset,#ipreset{margin-left:auto}body[data-mode=img] #preset,body:not([data-mode=img]) #ipreset{display:none}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0}
.kpi{background:var(--chip);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}.kpi span{font-size:11px;color:var(--dim)}.kpi b{font-size:20px;font-variant-numeric:tabular-nums;line-height:1.25}.kpi b small{font-size:11px;font-weight:500;color:var(--dim)}.kpi i{font-style:normal;font-size:11px;color:var(--dim)}.kpi.warn i{color:var(--warn)}
.checks{list-style:none;padding:0;margin:4px 0;font-size:12px}.checks li{padding:3px 0 3px 20px;position:relative}.checks li::before{position:absolute;left:2px;font-weight:700}.checks li.ok::before{content:"✓";color:var(--ok)}.checks li.warn::before{content:"!";color:var(--warn)}.checks li.warn{color:var(--warn)}
.prog .track{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:6px 0}.prog .bar{height:100%;width:0;background:var(--acc);transition:width .4s}.prog .log{font-size:11px;color:var(--dim);white-space:pre-wrap;max-height:9em;overflow:auto;margin:4px 0}.prog .val{margin-left:0}
table.chg tr{cursor:pointer}table.chg tr.sel td{background:color-mix(in srgb,#ffd23f 22%,transparent)}table.chg tr.part td{color:var(--dim)}td.dn{color:#2f7fe0;font-weight:600}td.up{color:#e0483e;font-weight:600}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;margin:6px 0}.legend .lg{flex:none;width:70px;height:10px;border-radius:5px;background:linear-gradient(90deg,#2e73f2,#dbdbdb,#f2402f)}.legend .btn{height:28px;padding:0 9px;font-size:12px}
.li.off{opacity:.45}
#ctv.cmp{width:min(860px,calc(100% - 90px))}#ctv .ctv-top{display:flex;gap:6px}#ctv .ctv-cell{position:relative;flex:1;min-width:0}#ctv .ctv-lab{position:absolute;right:6px;top:4px;font-size:11px;background:rgba(0,0,0,.55);padding:1px 6px;border-radius:5px}
#ctv.cmp .ctv-row canvas{width:25%}
[hidden]{display:none!important}
@media (min-width:900px){main{flex-direction:row-reverse}#panel{width:400px;height:auto;border-top:0;border-right:1px solid var(--line)}#collapse{display:none}#panel.min{height:auto}}
@media (max-width:520px){header h1 small{display:none}.seg button{padding:6px 9px}}
#ctv{position:absolute;top:10px;left:10px;width:440px;max-width:calc(100% - 90px);max-height:calc(100% - 20px);overflow:auto;background:rgba(14,17,22,.94);color:#e6e9ee;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px;z-index:5;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#ctv canvas{display:block;width:100%;height:auto;background:#000;border-radius:6px;touch-action:none;cursor:crosshair}
#ctv .ctv-row{display:flex;gap:6px;margin-top:6px}#ctv .ctv-row canvas{width:50%}
#ctv .ctv-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}#ctv .ctv-i{flex:1;font-size:12px;opacity:.8}#ctv .ctv-x{background:none;border:0;color:inherit;font-size:20px;cursor:pointer;line-height:1}
#ctv .ctv-sl{width:100%;margin:8px 0 4px}#ctv .ctv-c{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:12px;margin:4px 0}#ctv .ctv-c label{display:flex;align-items:center;gap:4px;cursor:pointer}#ctv .ctv-c i{width:10px;height:10px;border-radius:2px;display:inline-block}
#ctv .seg button{font-size:12px;padding:3px 10px}#ctv .ctv-n{font-size:11px;opacity:.7;margin:6px 0 0}
</style>
</head>
<body>
<div id="app">
<header><h1>個案化肌骨模型<small>v0.6</small></h1>
<div class="seg" id="mode"><button data-m="body" class="on">人形</button><button data-m="img">影像</button></div>
<div class="seg" id="ipreset"><button data-v="surface">體表</button><button data-v="xray" class="on">透視</button><button data-v="muscle">肌肉</button><button data-v="bone">骨骼</button><button data-v="organ">內臟</button></div>
<div class="seg" id="preset"><button data-v="surface">體表</button><button data-v="xray">透視</button><button data-v="muscle" class="on">肌肉</button><button data-v="bone">骨骼</button></div></header>
<main>
<section id="stage"><canvas id="cv"></canvas>
<div id="views"><button data-v="front">前</button><button data-v="back">後</button><button data-v="left">左</button><button data-v="right">右</button></div>
<div id="info" hidden><h2 id="i-zh"></h2><div class="en" id="i-en"></div><div class="sum" id="i-sum"></div><details id="i-more"><summary>詳細資料</summary><div id="i-kv"></div></details>
<div class="acts"><button class="btn ghost" id="i-focus">聚焦</button><button class="btn ghost" id="i-solo">只看這個</button><button class="btn ghost" id="i-hide">隱藏</button><button class="btn ghost" id="i-close">關閉</button></div></div>
<div id="busy" hidden>計算中…</div><div id="hint" hidden></div><div id="status"></div>
<div id="loading"><div class="track"><div id="lbar"></div></div><div id="lmsg">下載模型資料（約 11 MB）…</div></div>
</section>
<section id="panel">
<nav id="tabs"><button data-t="case" data-mode="body" class="on">個案</button><button data-t="muscle" data-mode="body">肌肉</button><button data-t="layer" data-mode="body">圖層</button><button data-t="meas" data-mode="body">量測</button><button data-t="list" data-mode="body">結構</button><button data-t="img" data-mode="img" hidden>影像</button><button data-t="struct" data-mode="img" hidden>結構</button><button data-t="cmp" data-mode="img" hidden>比較</button><button id="collapse" aria-label="收合面板">▾</button></nav>
<div class="tab" id="t-case"></div><div class="tab" id="t-muscle" hidden></div><div class="tab" id="t-layer" hidden></div><div class="tab" id="t-meas" hidden></div><div class="tab" id="t-list" hidden></div><div class="tab" id="t-img" hidden></div><div class="tab" id="t-struct" hidden></div><div class="tab" id="t-cmp" hidden></div>
</section>
</main>
</div>
<script defer src="model.js"></script>
<script defer src="app.js"></script>
</body>
</html>
